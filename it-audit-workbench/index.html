<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT Audit Workbench</title>
<style>
:root{
  --bg:#f5f6f8;--panel:#fff;--ink:#1d2330;--muted:#5f6878;--line:#dde1e7;--accent:#2457c5;--accent-ink:#fff;
  --crit:#b3261e;--high:#d9480f;--med:#b08800;--low:#2b8a3e;--chip:#eef1f6;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14171c;--panel:#1c2027;--ink:#e6e9ef;--muted:#9aa3b2;--line:#2e343e;--accent:#6c9cff;--accent-ink:#0b1020;
  --crit:#ff6b62;--high:#ff922b;--med:#f2c94c;--low:#51cf66;--chip:#262b34;}}
:root[data-theme="dark"]{
  --bg:#14171c;--panel:#1c2027;--ink:#e6e9ef;--muted:#9aa3b2;--line:#2e343e;--accent:#6c9cff;--accent-ink:#0b1020;
  --crit:#ff6b62;--high:#ff922b;--med:#f2c94c;--low:#51cf66;--chip:#262b34;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0 12px 0 0}
header .spacer{flex:1}
nav{display:flex;flex-wrap:wrap;gap:4px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
nav button{background:none;border:0;padding:8px 12px;border-radius:6px;color:var(--muted);cursor:pointer;font:inherit}
nav button.active{background:var(--chip);color:var(--ink);font-weight:600}
main{padding:16px;max-width:1400px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 12px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar h2{margin:0;flex:1}
button.btn,label.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:7px 12px;cursor:pointer;font:inherit;font-weight:600}
button.ghost,label.ghost{background:var(--chip);color:var(--ink)}
button.danger{background:var(--crit);color:#fff}
button.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:0 4px;font:inherit}
select,input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
textarea{min-height:70px;resize:vertical}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
td.actions{white-space:nowrap;text-align:right}
.empty{color:var(--muted);padding:16px 0}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--chip);white-space:nowrap}
.b-Critical{background:var(--crit);color:#fff}.b-High{background:var(--high);color:#fff}
.b-Medium{background:var(--med);color:#1d2330}.b-Low{background:var(--low);color:#fff}
.b-Effective{color:var(--low)}.b-Ineffective{color:var(--crit)}.b-Partially{color:var(--high)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.stat .n{font-size:28px;font-weight:700}.stat .l{color:var(--muted);font-size:12px}
.two{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--chip);margin:6px 0}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
.heat{display:grid;grid-template-columns:28px repeat(5,1fr);gap:3px;font-size:12px}
.heat div{padding:8px 4px;text-align:center;border-radius:4px;min-height:34px}
.heat .ax{color:var(--muted);background:none}
.muted{color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:10px;padding:0;background:var(--panel);color:var(--ink);width:min(760px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{padding:16px}
dialog h3{margin:0 0 12px}
.fields{display:grid;gap:10px 14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.fields .wide{grid-column:1/-1}
.fields label{display:block;font-size:12px;color:var(--muted);font-weight:600}
.fields .hint{font-size:12px;color:var(--muted);margin-top:2px}
.dlgbar{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.files li{margin:2px 0}.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;word-break:break-all}
@media print{header,nav,.toolbar button,td.actions{display:none}}
</style>
</head>
<body>
<header>
  <h1>IT Audit Workbench</h1>
  <label for="engSel" class="muted">Engagement</label>
  <select id="engSel" style="width:auto;min-width:220px"></select>
  <span class="spacer"></span>
  <button class="btn ghost" id="exportBtn" title="Download a full backup (JSON, includes evidence files)">Backup</button>
  <label class="btn ghost" title="Restore from a backup file">Restore<input type="file" id="importInp" accept="application/json" hidden></label>
</header>
<nav id="tabs"></nav>
<main id="view"></main>
<dialog id="dlg"></dialog>

<script>
"use strict";
/* ---------- Domain rules (pure functions) ---------- */
const LEVELS = ['Critical','High','Medium','Low'];
// Likelihood x Impact on a 5x5 scale.
function riskScore(l, i){ return (Number(l)||0) * (Number(i)||0); }
function criticality(l, i){
  const s = riskScore(l, i);
  if (s >= 20) return 'Critical';
  if (s >= 12) return 'High';
  if (s >= 6)  return 'Medium';
  return 'Low';
}
// Typical attribute-sampling minimums per control frequency (assumes low risk of failure;
// use the upper bound when the control is key or reliance is high).
const SAMPLE_GUIDE = {
  'Annual':[1,1],'Quarterly':[2,2],'Monthly':[2,5],'Weekly':[5,15],
  'Daily':[20,40],'Multiple times per day':[25,60],'Automated':[1,1],'As needed':[10,25]
};
function suggestedSample(freq, highRisk){
  const g = SAMPLE_GUIDE[freq]; if(!g) return '';
  return highRisk ? g[1] : g[0];
}
function isOverdue(date, status){
  if(!date || ['Complete','Closed','Risk accepted'].includes(status)) return false;
  return date < new Date().toISOString().slice(0,10);
}

/* ---------- Schemas ---------- */
const FRAMEWORKS = ['SOX ITGC','ISO/IEC 27001:2022','NIST CSF 2.0','NIST SP 800-53','COBIT 2019','PCI DSS 4.0','SOC 2','Internal policy','Other'];
const L5 = [['1','1 - Rare'],['2','2 - Unlikely'],['3','3 - Possible'],['4','4 - Likely'],['5','5 - Almost certain']];
const I5 = [['1','1 - Minimal'],['2','2 - Minor'],['3','3 - Moderate'],['4','4 - Major'],['5','5 - Severe']];
const SCHEMAS = {
  engagements:{label:'Engagement',fields:[
    {k:'name',l:'Engagement name',req:1},{k:'auditee',l:'Auditee / business unit'},
    {k:'framework',l:'Primary framework',t:'select',o:FRAMEWORKS},
    {k:'status',l:'Phase',t:'select',o:['Planning','Fieldwork','Reporting','Closed']},
    {k:'periodStart',l:'Audit period from',t:'date'},{k:'periodEnd',l:'Audit period to',t:'date'},
    {k:'fieldStart',l:'Fieldwork start',t:'date'},{k:'fieldEnd',l:'Fieldwork end',t:'date'},
    {k:'lead',l:'Audit lead'},{k:'team',l:'Team members'},
    {k:'objectives',l:'Objectives',t:'area',w:1},{k:'scope',l:'Scope (systems, locations, processes)',t:'area',w:1},
    {k:'outOfScope',l:'Out of scope / limitations',t:'area',w:1}]},
  risks:{label:'Risk area',fields:[
    {k:'area',l:'Auditable area',req:1,list:['Logical access','Privileged access','Change management','IT operations / job scheduling','Backup & recovery','Network security','Vendor / third-party management','Data protection','Physical security','Incident management']},
    {k:'system',l:'In-scope systems'},
    {k:'description',l:'Risk description',t:'area',w:1},
    {k:'likelihood',l:'Inherent likelihood',t:'select',o:L5},{k:'impact',l:'Inherent impact',t:'select',o:I5},
    {k:'response',l:'Planned audit response',t:'area',w:1}]},
  tests:{label:'Control test',fields:[
    {k:'controlId',l:'Control ID',req:1},{k:'controlName',l:'Control name',req:1},
    {k:'riskId',l:'Risk area',t:'ref',ref:'risks'},{k:'frameworkRef',l:'Framework reference',hint:'e.g. ISO A.5.15, NIST AC-2'},
    {k:'controlDesc',l:'Control description',t:'area',w:1},
    {k:'nature',l:'Control nature',t:'select',o:['Manual','IT-dependent manual','Automated']},
    {k:'frequency',l:'Control frequency',t:'select',o:Object.keys(SAMPLE_GUIDE)},
    {k:'keyControl',l:'Key control?',t:'select',o:['Yes','No']},
    {k:'testType',l:'Test method',t:'select',o:['Inquiry','Observation','Inspection','Re-performance','Walkthrough (design)']},
    {k:'procedure',l:'Test procedure / steps',t:'area',w:1},
    {k:'population',l:'Population (source & size)'},{k:'sampleSize',l:'Sample size',hint:'Suggested from frequency; edit if needed'},
    {k:'exceptions',l:'Exceptions found',t:'number'},
    {k:'tester',l:'Tester'},{k:'reviewer',l:'Reviewer'},{k:'dueDate',l:'Due date',t:'date'},
    {k:'status',l:'Status',t:'select',o:['Not started','In progress','Ready for review','Complete']},
    {k:'result',l:'Conclusion',t:'select',o:['Not concluded','Effective','Partially effective','Ineffective']},
    {k:'notes',l:'Workpaper notes',t:'area',w:1}]},
  evidence:{label:'Evidence',fields:[
    {k:'title',l:'Evidence title',req:1},{k:'testId',l:'Supports test',t:'ref',ref:'tests'},
    {k:'type',l:'Type',t:'select',o:['System report / extract','Screenshot','Configuration export','Policy / procedure','Ticket / approval','Email','Interview notes','Log file','Other']},
    {k:'pbcStatus',l:'Request (PBC) status',t:'select',o:['Requested','Received','Accepted','Rejected - resubmit']},
    {k:'requestedFrom',l:'Requested from / source'},{k:'requestedOn',l:'Requested on',t:'date'},
    {k:'collectedBy',l:'Collected by'},{k:'collectedOn',l:'Received on',t:'date'},
    {k:'notes',l:'Notes (completeness & accuracy checks)',t:'area',w:1},
    {k:'files',l:'Attach files',t:'files',w:1}]},
  issues:{label:'Issue',fields:[
    {k:'title',l:'Issue title',req:1},{k:'testId',l:'Raised from test',t:'ref',ref:'tests'},
    {k:'condition',l:'Condition (what we found)',t:'area',w:1},{k:'criteria',l:'Criteria (what should be)',t:'area',w:1},
    {k:'cause',l:'Cause',t:'area'},{k:'effect',l:'Effect / risk',t:'area'},
    {k:'likelihood',l:'Likelihood',t:'select',o:L5},{k:'impact',l:'Impact',t:'select',o:I5},
    {k:'recommendation',l:'Recommendation',t:'area',w:1},
    {k:'owner',l:'Management owner'},{k:'dueDate',l:'Remediation due',t:'date'},
    {k:'status',l:'Status',t:'select',o:['Open','Remediation in progress','Ready for validation','Closed','Risk accepted']},
    {k:'response',l:'Management response',t:'area',w:1}]}
};

/* ---------- ITGC control library ---------- */
const LIBRARY = [
  ['AC-01','User access provisioning','Logical access','New user access is requested, approved by an appropriate manager and granted consistent with the approval.','As needed','Obtain list of users created in the period; sample new users; inspect approved request predates access and matches role granted.'],
  ['AC-02','Timely removal of terminated users','Logical access','Access for terminated employees is revoked within the defined SLA (e.g. 1 business day).','As needed','Obtain HR termination list; compare to system user list and last-logon dates; for a sample, confirm removal date within SLA.'],
  ['AC-03','Periodic user access review','Logical access','Application owners review user access quarterly and remove inappropriate access.','Quarterly','Inspect review evidence for sampled quarters: completeness of the listing, reviewer sign-off, and removals actioned.'],
  ['AC-04','Privileged access restriction','Privileged access','Administrative/superuser access is limited to authorised personnel with a business need.','Quarterly','Obtain admin account listing; validate each account to job role and approval; check for generic/shared accounts.'],
  ['AC-05','Password / authentication settings','Logical access','Authentication is enforced in line with policy (MFA, length, lockout).','Automated','Inspect system configuration against policy; test of one (automated control) plus baseline of change history.'],
  ['CM-01','Change authorisation & testing','Change management','Changes to production are tested and approved before migration.','As needed','Obtain population of production changes; sample; inspect testing evidence and approval prior to deployment date.'],
  ['CM-02','Segregation of duties in deployment','Change management','Developers cannot migrate their own changes to production.','Automated','Inspect deployment tool permissions; compare developer list to users with deploy rights.'],
  ['CM-03','Emergency changes','Change management','Emergency changes are approved retrospectively within the defined window.','As needed','Sample emergency changes; inspect post-implementation approval within SLA.'],
  ['OP-01','Job scheduling & failure monitoring','IT operations / job scheduling','Batch job failures are detected, logged and resolved.','Daily','Sample days; inspect job logs and tickets for failed jobs and their resolution.'],
  ['OP-02','Backup completion & restore testing','Backup & recovery','Backups are performed per schedule and restores are tested periodically.','Daily','Sample backup logs for success; inspect evidence of the most recent restore test.'],
  ['NS-01','Firewall rule review','Network security','Firewall rules are reviewed periodically and unnecessary rules removed.','Annual','Inspect last rule review, approvals, and follow-up on rules flagged for removal.'],
  ['IM-01','Security incident management','Incident management','Security incidents are logged, classified, escalated and resolved per procedure.','As needed','Sample incidents; inspect classification, escalation and closure evidence against procedure timelines.']
];

/* ---------- Storage (IndexedDB) ---------- */
const DB_NAME = 'it-audit-workbench', STORES = ['engagements','risks','tests','evidence','issues','files','meta'];
let db;
function openDb(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => STORES.forEach(s => r.result.objectStoreNames.contains(s) || r.result.createObjectStore(s, {keyPath:'id'}));
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
function tx(store, mode, fn){
  return new Promise((res, rej) => {
    const t = db.transaction(store, mode), s = t.objectStore(store); let out;
    const r = fn(s); if (r) r.onsuccess = () => out = r.result;
    t.oncomplete = () => res(out); t.onerror = () => rej(t.error);
  });
}
const dbAll = s => tx(s, 'readonly', st => st.getAll());
const dbGet = (s, id) => tx(s, 'readonly', st => st.get(id));
const dbPut = (s, v) => tx(s, 'readwrite', st => st.put(v));
const dbDel = (s, id) => tx(s, 'readwrite', st => st.delete(id));

/* ---------- State ---------- */
const S = {engagements:[],risks:[],tests:[],evidence:[],issues:[],eng:null,tab:'dashboard'};
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2));
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date().toISOString().slice(0,10);
const forEng = k => S[k].filter(x => x.engagementId === S.eng);
const byId = (k, id) => S[k].find(x => x.id === id);
const badge = (v, cls) => v ? `<span class="badge ${cls||''}">${esc(v)}</span>` : '';
const critBadge = r => badge(criticality(r.likelihood, r.impact), 'b-'+criticality(r.likelihood, r.impact));
const resultBadge = v => badge(v, 'b-'+String(v||'').split(' ')[0]);
const due = (d, st) => d ? `<span${isOverdue(d, st) ? ' style="color:var(--crit);font-weight:600" title="Overdue"' : ''}>${esc(d)}</span>` : '';

async function load(){
  for (const k of ['engagements','risks','tests','evidence','issues']) S[k] = await dbAll(k);
  const m = await dbGet('meta','ui');
  S.eng = (m && byId('engagements', m.eng)) ? m.eng : (S.engagements[0]||{}).id || null;
}
async function save(k, rec){ await dbPut(k, rec); const i = S[k].findIndex(x => x.id === rec.id); i < 0 ? S[k].push(rec) : (S[k][i] = rec); }
async function remove(k, id){
  const rec = byId(k, id);
  if (k === 'evidence') for (const f of rec.files||[]) await dbDel('files', f.id);
  await dbDel(k, id); S[k] = S[k].filter(x => x.id !== id);
}
const saveUi = () => dbPut('meta', {id:'ui', eng:S.eng});

/* ---------- Generic form dialog ---------- */
const dlg = document.getElementById('dlg');
function fieldHtml(f, v){
  const id = 'f_'+f.k, req = f.req ? ' required' : '';
  let inp;
  if (f.t === 'select'){
    inp = `<select id="${id}" name="${f.k}"><option value=""></option>${f.o.map(o => { const [val, lab] = Array.isArray(o) ? o : [o, o];
      return `<option value="${esc(val)}"${String(v)===String(val)?' selected':''}>${esc(lab)}</option>`; }).join('')}</select>`;
  } else if (f.t === 'ref'){
    const opts = forEng(f.ref).map(r => [r.id, f.ref === 'tests' ? `${r.controlId} - ${r.controlName}` : r.area]);
    inp = `<select id="${id}" name="${f.k}"><option value=""></option>${opts.map(([val, lab]) => `<option value="${esc(val)}"${v===val?' selected':''}>${esc(lab)}</option>`).join('')}</select>`;
  } else if (f.t === 'area'){
    inp = `<textarea id="${id}" name="${f.k}"${req}>${esc(v)}</textarea>`;
  } else if (f.t === 'files'){
    inp = `<input type="file" id="${id}" multiple><ul class="files" id="fileList"></ul>`;
  } else {
    const dl = f.list ? ` list="dl_${f.k}"` : '';
    inp = `<input id="${id}" name="${f.k}" type="${f.t||'text'}" value="${esc(v)}"${req}${dl}>` +
      (f.list ? `<datalist id="dl_${f.k}">${f.list.map(o => `<option value="${esc(o)}">`).join('')}</datalist>` : '');
  }
  return `<div class="${f.w?'wide':''}"><label for="${id}">${esc(f.l)}${f.req?' *':''}</label>${inp}${f.hint?`<div class="hint">${esc(f.hint)}</div>`:''}</div>`;
}
function openForm(k, rec, defaults){
  const sc = SCHEMAS[k], isNew = !rec; rec = rec || Object.assign({}, defaults);
  dlg.innerHTML = `<form method="dialog"><h3>${isNew?'New':'Edit'} ${esc(sc.label.toLowerCase())}</h3>
    <div class="fields">${sc.fields.map(f => fieldHtml(f, rec[f.k])).join('')}</div>
    <div id="calc" class="muted" style="margin-top:8px"></div>
    <div class="dlgbar"><button type="button" class="btn ghost" value="cancel" id="cancelBtn">Cancel</button><button class="btn" id="saveBtn">Save</button></div></form>`;
  const form = dlg.querySelector('form'), calc = dlg.querySelector('#calc');
  let files = (rec.files||[]).slice();
  const drawFiles = () => { const ul = dlg.querySelector('#fileList'); if (!ul) return;
    ul.innerHTML = files.map((f, i) => `<li>${esc(f.name)} <span class="muted">(${fmtSize(f.size)})</span> <button type="button" class="link" data-rm="${i}">remove</button></li>`).join(''); };
  drawFiles();
  dlg.querySelector('#fileList')?.addEventListener('click', e => { const i = e.target.dataset.rm; if (i != null){ files.splice(+i, 1); drawFiles(); } });
  dlg.querySelector('#f_files')?.addEventListener('change', async e => {
    for (const file of e.target.files){
      const buf = await file.arrayBuffer(), sha256 = await hash(buf), fid = uid();
      await dbPut('files', {id:fid, blob:new Blob([buf], {type:file.type})});
      files.push({id:fid, name:file.name, size:file.size, type:file.type, sha256, added:new Date().toISOString()});
    }
    e.target.value = ''; drawFiles();
  });
  const refresh = () => {
    const d = Object.fromEntries(new FormData(form));
    if ('likelihood' in d && d.likelihood && d.impact)
      calc.innerHTML = `Risk score ${riskScore(d.likelihood, d.impact)} / 25 &rarr; ${badge(criticality(d.likelihood, d.impact), 'b-'+criticality(d.likelihood, d.impact))}`;
  };
  form.addEventListener('input', refresh); refresh();
  // Suggest sample size when frequency or key-control flag changes (tests only).
  ['f_frequency','f_keyControl'].forEach(id => dlg.querySelector('#'+id)?.addEventListener('change', () => {
    const fr = form.frequency.value, key = form.keyControl.value === 'Yes', ss = form.sampleSize;
    if (fr) { ss.value = suggestedSample(fr, key); ss.dispatchEvent(new Event('input')); }
  }));
  dlg.querySelector('#cancelBtn').onclick = () => dlg.close();
  form.onsubmit = async e => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(form));
    const out = Object.assign({}, rec, d, {id:rec.id||uid(), updated:new Date().toISOString()});
    if (!rec.created) out.created = out.updated;
    if (k !== 'engagements') out.engagementId = rec.engagementId || S.eng;
    if (sc.fields.some(f => f.t === 'files')){
      for (const f of rec.files||[]) if (!files.find(x => x.id === f.id)) await dbDel('files', f.id);
      out.files = files;
    }
    await save(k, out);
    if (k === 'engagements' && isNew){ S.eng = out.id; saveUi(); }
    dlg.close(); render();
  };
  dlg.showModal();
}
async function hash(buf){
  if (!crypto.subtle) return 'unavailable (open over https or file://)';
  return [...new Uint8Array(await crypto.subtle.digest('SHA-256', buf))].map(b => b.toString(16).padStart(2,'0')).join('');
}
const fmtSize = n => n < 1024 ? n+' B' : n < 1048576 ? (n/1024).toFixed(1)+' KB' : (n/1048576).toFixed(1)+' MB';

/* ---------- Generic table ---------- */
function table(k, cols, rows, extra){
  if (!rows.length) return `<div class="empty">Nothing here yet.</div>`;
  return `<div class="tablewrap"><table><thead><tr>${cols.map(c => `<th>${esc(c[0])}</th>`).join('')}<th></th></tr></thead><tbody>
    ${rows.map(r => `<tr>${cols.map(c => `<td>${c[1](r)}</td>`).join('')}<td class="actions">${extra ? extra(r) : ''}
      <button class="link" data-edit="${k}" data-id="${r.id}">Edit</button><button class="link" data-del="${k}" data-id="${r.id}">Delete</button></td></tr>`).join('')}
  </tbody></table></div>`;
}

/* ---------- Views ---------- */
const TABS = [['dashboard','Dashboard'],['planning','Planning'],['tests','Audit tests'],['evidence','Evidence'],['issues','Issues'],['report','Report']];
const view = document.getElementById('view');
const needEng = () => `<div class="card"><h2>Start an engagement</h2><p class="muted">Create an audit engagement to plan scope, run control tests, collect evidence and rate issues.</p>
  <button class="btn" data-new="engagements">New engagement</button></div>`;

const VIEWS = {
  dashboard(){
    const e = byId('engagements', S.eng), T = forEng('tests'), I = forEng('issues'), E = forEng('evidence');
    const st = c => T.filter(t => t.status === c).length, done = st('Complete');
    const open = I.filter(i => !['Closed','Risk accepted'].includes(i.status));
    const lv = LEVELS.map(l => [l, open.filter(i => criticality(i.likelihood, i.impact) === l).length]);
    const overdue = [...T.filter(t => isOverdue(t.dueDate, t.status)).map(t => ['Test', `${t.controlId} ${t.controlName}`, t.dueDate]),
                     ...I.filter(i => isOverdue(i.dueDate, i.status)).map(i => ['Issue', i.title, i.dueDate])];
    const pending = E.filter(x => x.pbcStatus === 'Requested' || x.pbcStatus === 'Rejected - resubmit');
    const seg = (n, c) => T.length ? `<span style="width:${n/T.length*100}%;background:${c}"></span>` : '';
    return `<div class="card"><div class="toolbar"><h2>${esc(e.name)}</h2>${badge(e.status)}<button class="btn ghost" data-edit="engagements" data-id="${e.id}">Edit engagement</button></div>
      <div class="muted">${esc(e.auditee)}${e.framework?' &middot; '+esc(e.framework):''}${e.periodStart?` &middot; Period ${esc(e.periodStart)} to ${esc(e.periodEnd)}`:''}${e.lead?' &middot; Lead: '+esc(e.lead):''}</div></div>
      <div class="grid">
        <div class="card stat"><div class="n">${T.length}</div><div class="l">Control tests</div></div>
        <div class="card stat"><div class="n">${T.length ? Math.round(done/T.length*100) : 0}%</div><div class="l">Testing complete</div></div>
        <div class="card stat"><div class="n">${E.length}</div><div class="l">Evidence items (${pending.length} outstanding)</div></div>
        <div class="card stat"><div class="n">${open.length}</div><div class="l">Open issues</div></div>
        <div class="card stat"><div class="n" style="color:${overdue.length?'var(--crit)':'inherit'}">${overdue.length}</div><div class="l">Overdue items</div></div>
      </div>
      <div class="two">
        <div class="card"><h2>Testing progress</h2>
          <div class="bar">${seg(done,'var(--low)')}${seg(st('Ready for review'),'var(--accent)')}${seg(st('In progress'),'var(--med)')}</div>
          <div class="legend"><span><i style="background:var(--low)"></i>Complete ${done}</span><span><i style="background:var(--accent)"></i>For review ${st('Ready for review')}</span>
          <span><i style="background:var(--med)"></i>In progress ${st('In progress')}</span><span><i style="background:var(--chip)"></i>Not started ${T.length-done-st('Ready for review')-st('In progress')}</span></div>
          <h2 style="margin-top:16px">Conclusions</h2>
          <div class="legend">${['Effective','Partially effective','Ineffective','Not concluded'].map(r => `<span>${esc(r)}: <b>${T.filter(t => (t.result||'Not concluded') === r).length}</b></span>`).join('')}</div>
        </div>
        <div class="card"><h2>Open issues by criticality</h2>
          <div class="legend" style="gap:8px">${lv.map(([l, n]) => `<span class="badge b-${l}">${l}: ${n}</span>`).join('')}</div>
          <div style="margin-top:12px">${heatmap(open)}</div></div>
      </div>
      <div class="card"><h2>Overdue</h2>${overdue.length ? `<div class="tablewrap"><table><tr><th>Type</th><th>Item</th><th>Due</th></tr>${overdue.map(o => `<tr><td>${o[0]}</td><td>${esc(o[1])}</td><td style="color:var(--crit)">${esc(o[2])}</td></tr>`).join('')}</table></div>` : '<div class="empty">Nothing overdue.</div>'}</div>`;
  },
  planning(){
    const e = byId('engagements', S.eng), R = forEng('risks').sort((a, b) => riskScore(b.likelihood, b.impact) - riskScore(a.likelihood, a.impact));
    const row = (l, v) => v ? `<tr><th style="width:200px">${l}</th><td style="white-space:pre-wrap">${esc(v)}</td></tr>` : '';
    return `<div class="card"><div class="toolbar"><h2>Audit plan</h2><button class="link" data-del="engagements" data-id="${e.id}">Delete engagement</button><button class="btn ghost" data-edit="engagements" data-id="${e.id}">Edit plan</button></div>
      <div class="tablewrap"><table>${row('Engagement', e.name)}${row('Auditee', e.auditee)}${row('Framework', e.framework)}
      ${row('Audit period', e.periodStart && `${e.periodStart} to ${e.periodEnd}`)}${row('Fieldwork', e.fieldStart && `${e.fieldStart} to ${e.fieldEnd}`)}
      ${row('Team', [e.lead && 'Lead: '+e.lead, e.team].filter(Boolean).join('; '))}${row('Objectives', e.objectives)}${row('Scope', e.scope)}${row('Out of scope', e.outOfScope)}</table></div></div>
      <div class="card"><div class="toolbar"><h2>Risk assessment</h2><button class="btn" data-new="risks">Add risk area</button></div>
      <p class="muted" style="margin-top:0">Rate inherent risk to prioritise testing. Highest-rated areas appear first.</p>
      ${table('risks', [['Area', r => esc(r.area)], ['Systems', r => esc(r.system)], ['L x I', r => r.likelihood ? `${r.likelihood} x ${r.impact} = ${riskScore(r.likelihood, r.impact)}` : ''],
        ['Rating', r => r.likelihood ? critBadge(r) : ''], ['Tests', r => forEng('tests').filter(t => t.riskId === r.id).length], ['Planned response', r => esc(r.response)]], R)}</div>`;
  },
  tests(){
    const T = forEng('tests').sort((a, b) => a.controlId.localeCompare(b.controlId)), E = forEng('evidence');
    return `<div class="card"><div class="toolbar"><h2>Control tests</h2><button class="btn ghost" id="libBtn">Add from ITGC library</button><button class="btn" data-new="tests">New test</button></div>
      ${table('tests', [['ID', t => `<b style="white-space:nowrap">${esc(t.controlId)}</b>`], ['Control', t => esc(t.controlName) + (t.keyControl === 'Yes' ? ' <span class="badge">Key</span>' : '')],
        ['Risk area', t => esc((byId('risks', t.riskId)||{}).area)], ['Method', t => esc(t.testType)], ['Sample', t => esc(t.sampleSize) + (t.exceptions > 0 ? ` <span style="color:var(--crit)">(${esc(t.exceptions)} exc.)</span>` : '')],
        ['Evidence', t => E.filter(x => x.testId === t.id).length], ['Tester', t => esc(t.tester)], ['Due', t => due(t.dueDate, t.status)],
        ['Status', t => badge(t.status)], ['Conclusion', t => resultBadge(t.result)]], T,
        t => `<button class="link" data-addev="${t.id}">+ Evidence</button>${['Ineffective','Partially effective'].includes(t.result) ? `<button class="link" data-raise="${t.id}">Raise issue</button>` : ''}`)}</div>`;
  },
  evidence(){
    const E = forEng('evidence');
    const files = x => (x.files||[]).map(f => `<div><button class="link" data-file="${f.id}" data-name="${esc(f.name)}">${esc(f.name)}</button>
      <div class="mono muted" title="SHA-256">SHA-256 ${esc(f.sha256)}</div></div>`).join('');
    return `<div class="card"><div class="toolbar"><h2>Evidence & requests (PBC)</h2><button class="btn" data-new="evidence">Add evidence</button></div>
      <p class="muted" style="margin-top:0">Files are stored locally in this browser with a SHA-256 fingerprint so you can show they were not altered after collection.</p>
      ${table('evidence', [['Evidence', x => `<b>${esc(x.title)}</b><div class="muted">${esc(x.type)}</div>`],
        ['Test', x => { const t = byId('tests', x.testId); return t ? esc(t.controlId) : '<span class="muted">unlinked</span>'; }],
        ['Request', x => badge(x.pbcStatus) + `<div class="muted">${esc(x.requestedFrom)}${x.requestedOn ? ' &middot; '+esc(x.requestedOn) : ''}</div>`],
        ['Received', x => esc(x.collectedOn) + (x.collectedBy ? `<div class="muted">by ${esc(x.collectedBy)}</div>` : '')], ['Files', files]], E)}</div>`;
  },
  issues(){
    const I = forEng('issues').sort((a, b) => riskScore(b.likelihood, b.impact) - riskScore(a.likelihood, a.impact));
    return `<div class="two"><div class="card" style="grid-column:span 2;min-width:0"><div class="toolbar"><h2>Issues / findings</h2><button class="btn ghost" id="csvIssues">Export CSV</button><button class="btn" data-new="issues">New issue</button></div>
      ${table('issues', [['Criticality', i => critBadge(i) + `<div class="muted">score ${riskScore(i.likelihood, i.impact)}</div>`], ['Issue', i => `<b>${esc(i.title)}</b><div class="muted">${esc((i.condition||'').slice(0, 140))}</div>`],
        ['Test', i => esc((byId('tests', i.testId)||{}).controlId)], ['Owner', i => esc(i.owner)], ['Due', i => due(i.dueDate, i.status)], ['Status', i => badge(i.status)]], I)}</div></div>
      <div class="card"><h2>How criticality is rated</h2><p class="muted" style="margin-top:0">Score = Likelihood (1-5) x Impact (1-5).</p>
        <div class="legend" style="gap:8px"><span class="badge b-Critical">Critical 20-25</span><span class="badge b-High">High 12-19</span><span class="badge b-Medium">Medium 6-11</span><span class="badge b-Low">Low 1-5</span></div>
        <div style="margin-top:12px">${heatmap(I.filter(i => !['Closed','Risk accepted'].includes(i.status)))}</div></div>`;
  },
  report(){
    const e = byId('engagements', S.eng), T = forEng('tests'), R = forEng('risks'), E = forEng('evidence');
    const I = forEng('issues').sort((a, b) => riskScore(b.likelihood, b.impact) - riskScore(a.likelihood, a.impact));
    const cnt = l => I.filter(i => criticality(i.likelihood, i.impact) === l).length;
    const para = (h, v) => v ? `<h3>${h}</h3><p style="white-space:pre-wrap">${esc(v)}</p>` : '';
    return `<div class="card"><div class="toolbar"><h2>Audit report draft</h2><button class="btn ghost" id="csvTests">Tests CSV</button><button class="btn" onclick="print()">Print / Save as PDF</button></div>
      <h1 style="font-size:20px;margin:0">${esc(e.name)}</h1><p class="muted">${esc(e.auditee)} &middot; ${esc(e.framework)} &middot; Period ${esc(e.periodStart)} to ${esc(e.periodEnd)} &middot; Generated ${today()}</p>
      <h3>Executive summary</h3><p>We tested <b>${T.length}</b> controls across <b>${R.length}</b> risk areas, supported by <b>${E.length}</b> evidence items.
      ${T.filter(t => t.result === 'Effective').length} controls were effective, ${T.filter(t => t.result === 'Partially effective').length} partially effective and ${T.filter(t => t.result === 'Ineffective').length} ineffective.
      We raised <b>${I.length}</b> issues: ${LEVELS.map(l => `${cnt(l)} ${l.toLowerCase()}`).join(', ')}.</p>
      ${para('Objectives', e.objectives)}${para('Scope', e.scope)}${para('Out of scope / limitations', e.outOfScope)}
      <h3>Detailed findings</h3>${I.length ? I.map((i, n) => `<div class="card"><div class="toolbar"><h2>${n+1}. ${esc(i.title)}</h2>${critBadge(i)}</div>
        ${[['Condition', i.condition], ['Criteria', i.criteria], ['Cause', i.cause], ['Effect', i.effect], ['Recommendation', i.recommendation], ['Management response', i.response]]
          .filter(x => x[1]).map(x => `<p><b>${x[0]}:</b> <span style="white-space:pre-wrap">${esc(x[1])}</span></p>`).join('')}
        <p class="muted">Owner: ${esc(i.owner) || '-'} &middot; Due: ${esc(i.dueDate) || '-'} &middot; Status: ${esc(i.status) || '-'}</p></div>`).join('') : '<p class="muted">No issues raised.</p>'}
      <h3>Controls tested</h3><div class="tablewrap"><table><tr><th>ID</th><th>Control</th><th>Method</th><th>Sample</th><th>Exceptions</th><th>Conclusion</th></tr>
      ${T.map(t => `<tr><td>${esc(t.controlId)}</td><td>${esc(t.controlName)}</td><td>${esc(t.testType)}</td><td>${esc(t.sampleSize)}</td><td>${esc(t.exceptions)}</td><td>${resultBadge(t.result)}</td></tr>`).join('')}</table></div></div>`;
  }
};
function heatmap(issues){
  const colour = s => s >= 20 ? 'var(--crit)' : s >= 12 ? 'var(--high)' : s >= 6 ? 'var(--med)' : 'var(--low)';
  let h = '<div class="heat">';
  for (let imp = 5; imp >= 1; imp--){
    h += `<div class="ax">${imp}</div>`;
    for (let l = 1; l <= 5; l++){ const n = issues.filter(i => +i.likelihood === l && +i.impact === imp).length;
      h += `<div style="background:${colour(l*imp)};opacity:${n ? 1 : .28};color:#fff;font-weight:700">${n || ''}</div>`; }
  }
  return h + '<div class="ax"></div>' + [1,2,3,4,5].map(l => `<div class="ax">${l}</div>`).join('') + '</div><div class="muted" style="font-size:12px;text-align:center">Likelihood &rarr; (rows: Impact)</div>';
}

/* ---------- Render & events ---------- */
function render(){
  const sel = document.getElementById('engSel');
  sel.innerHTML = S.engagements.map(e => `<option value="${e.id}"${e.id===S.eng?' selected':''}>${esc(e.name)}</option>`).join('') + '<option value="__new">+ New engagement...</option>';
  document.getElementById('tabs').innerHTML = TABS.map(([k, l]) => `<button data-tab="${k}" class="${S.tab===k?'active':''}">${l}</button>`).join('');
  view.innerHTML = S.eng ? VIEWS[S.tab]() : needEng();
}
document.getElementById('engSel').onchange = e => {
  if (e.target.value === '__new'){ e.target.value = S.eng || ''; openForm('engagements'); return; }
  S.eng = e.target.value; saveUi(); render();
};
document.addEventListener('click', async e => {
  const d = e.target.dataset || {};
  if (d.tab){ S.tab = d.tab; render(); }
  else if (d.new) openForm(d.new);
  else if (d.edit) openForm(d.edit, byId(d.edit, d.id));
  else if (d.del){
    const k = d.del, rec = byId(k, d.id);
    if (k === 'engagements'){
      if (!confirm('Delete this engagement and ALL its risks, tests, evidence and issues?')) return;
      for (const c of ['risks','tests','evidence','issues']) for (const x of S[c].filter(x => x.engagementId === rec.id)) await remove(c, x.id);
      await remove(k, rec.id); S.eng = (S.engagements[0]||{}).id || null; saveUi();
    } else {
      if (!confirm(`Delete this ${SCHEMAS[k].label.toLowerCase()}?`)) return;
      await remove(k, d.id);
    }
    render();
  }
  else if (d.addev) openForm('evidence', null, {testId:d.addev, pbcStatus:'Requested', requestedOn:today()});
  else if (d.raise){
    const t = byId('tests', d.raise);
    openForm('issues', null, {testId:t.id, status:'Open', title:`${t.controlName} - control deficiency`,
      condition:`Testing of ${t.controlId} found ${t.exceptions||'?'} exception(s) in a sample of ${t.sampleSize||'?'}.`, criteria:t.controlDesc});
  }
  else if (d.file){
    const f = await dbGet('files', d.file); if (!f) return alert('File not found.');
    const a = document.createElement('a'); a.href = URL.createObjectURL(f.blob); a.download = d.name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }
  else if (e.target.id === 'libBtn') openLibrary();
  else if (e.target.id === 'csvIssues') downloadCsv('issues.csv', forEng('issues').map(i => ({Criticality:criticality(i.likelihood, i.impact), Score:riskScore(i.likelihood, i.impact),
      Title:i.title, Test:(byId('tests', i.testId)||{}).controlId, Condition:i.condition, Criteria:i.criteria, Cause:i.cause, Effect:i.effect,
      Recommendation:i.recommendation, Owner:i.owner, Due:i.dueDate, Status:i.status, 'Management response':i.response})));
  else if (e.target.id === 'csvTests') downloadCsv('tests.csv', forEng('tests').map(t => ({ID:t.controlId, Control:t.controlName, 'Framework ref':t.frameworkRef,
      Risk:(byId('risks', t.riskId)||{}).area, Method:t.testType, Frequency:t.frequency, Population:t.population, Sample:t.sampleSize, Exceptions:t.exceptions,
      Tester:t.tester, Reviewer:t.reviewer, Status:t.status, Conclusion:t.result, 'Evidence items':forEng('evidence').filter(x => x.testId === t.id).length})));
});

function openLibrary(){
  const have = new Set(forEng('tests').map(t => t.controlId));
  dlg.innerHTML = `<form method="dialog"><h3>ITGC control library</h3><p class="muted">Pick standard IT general controls to add as tests. You can edit them afterwards.</p>
    <div class="tablewrap"><table>${LIBRARY.map((c, i) => `<tr><td><input type="checkbox" name="c" value="${i}" style="width:auto"${have.has(c[0])?' disabled':''}></td>
      <td><b>${c[0]}</b></td><td>${esc(c[1])}<div class="muted">${esc(c[3])}</div></td><td class="muted">${esc(c[4])}</td></tr>`).join('')}</table></div>
    <div class="dlgbar"><button type="button" class="btn ghost" id="cancelBtn">Cancel</button><button class="btn">Add selected</button></div></form>`;
  dlg.querySelector('#cancelBtn').onclick = () => dlg.close();
  dlg.querySelector('form').onsubmit = async ev => {
    ev.preventDefault();
    for (const i of new FormData(ev.target).getAll('c')){
      const [controlId, controlName, area, controlDesc, frequency, procedure] = LIBRARY[i];
      let risk = forEng('risks').find(r => r.area === area);
      if (!risk){ risk = {id:uid(), engagementId:S.eng, area, created:new Date().toISOString()}; await save('risks', risk); }
      await save('tests', {id:uid(), engagementId:S.eng, controlId, controlName, controlDesc, frequency, procedure, riskId:risk.id,
        keyControl:'Yes', sampleSize:String(suggestedSample(frequency, true)), testType:'Inspection', status:'Not started', result:'Not concluded', created:new Date().toISOString()});
    }
    dlg.close(); render();
  };
  dlg.showModal();
}

function downloadCsv(name, rows){
  if (!rows.length) return alert('Nothing to export.');
  const cell = v => { v = String(v ?? ''); if (/^[=+\-@]/.test(v)) v = "'" + v; return /[",\n\r]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
  const csv = [Object.keys(rows[0]), ...rows.map(Object.values)].map(r => r.map(cell).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], {type:'text/csv'})); a.download = name; a.click();
}

/* ---------- Backup / restore ---------- */
const b64 = buf => { let s = ''; const u = new Uint8Array(buf); for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode(...u.subarray(i, i + 0x8000)); return btoa(s); };
document.getElementById('exportBtn').onclick = async () => {
  const out = {app:'it-audit-workbench', version:1, exported:new Date().toISOString(), files:[]};
  for (const k of ['engagements','risks','tests','evidence','issues']) out[k] = S[k];
  for (const f of await dbAll('files')) out.files.push({id:f.id, type:f.blob.type, data:b64(await f.blob.arrayBuffer())});
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(out)], {type:'application/json'}));
  a.download = `audit-workbench-backup-${today()}.json`; a.click();
};
document.getElementById('importInp').onchange = async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  let data; try { data = JSON.parse(await file.text()); } catch { return alert('Not a valid backup file.'); }
  if (data.app !== 'it-audit-workbench') return alert('Not a valid backup file.');
  if (!confirm('Restore will merge the backup into your current data (records with the same ID are overwritten). Continue?')) return;
  for (const k of ['engagements','risks','tests','evidence','issues']) for (const r of data[k]||[]) await save(k, r);
  for (const f of data.files||[]) await dbPut('files', {id:f.id, blob:new Blob([Uint8Array.from(atob(f.data), c => c.charCodeAt(0))], {type:f.type})});
  if (!S.eng) S.eng = (S.engagements[0]||{}).id || null;
  saveUi(); render(); alert('Restore complete.');
};

openDb().then(d => { db = d; return load(); }).then(render)
  .catch(err => { view.innerHTML = `<div class="card">Could not open local storage: ${esc(err.message)}. Try a different browser or disable private mode.</div>`; });
</script>
